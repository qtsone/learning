# The API key timesvc requires on GET /now.
#
# This file exists so you can see what a Secret is: it is a ConfigMap with a
# different kind, base64 in the data field, and slightly better handling by the
# platform. It is not encryption. In a real repository you would keep the value
# out of git entirely (sealed-secrets, SOPS, External Secrets, a cloud secret
# manager) — the value you put here is a throwaway for a local cluster, and
# NOTES.md asks you to explain the difference.
apiVersion: v1
kind: Secret
metadata:
  name: timesvc-secrets
  namespace: timesvc
  labels:
    app: timesvc
type: Opaque
stringData:
  # TODO: API_KEY. Use stringData (plain text, the API server base64-encodes it
  # for you) rather than data, and replace this placeholder with a value you
  # invented — "change-me" does not count.
  API_KEY: change-me
