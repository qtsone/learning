# Reference solution.
#
# stringData is plain text that the API server base64-encodes on write; data is
# base64 you encode yourself. Neither is encryption: `kubectl get secret -o yaml`
# hands the value to anyone with get access in this namespace, and without
# encryption-at-rest configured it also sits in etcd in the clear.
#
# A real repository would not hold this value at all. It would hold a
# SealedSecret / SOPS-encrypted file / ExternalSecret pointing at a secret
# manager, and this object would be produced in the cluster. The value below is
# a throwaway for a local cluster.
apiVersion: v1
kind: Secret
metadata:
  name: timesvc-secrets
  namespace: timesvc
  labels:
    app: timesvc
type: Opaque
stringData:
  API_KEY: "local-dev-2f9c41ab"
