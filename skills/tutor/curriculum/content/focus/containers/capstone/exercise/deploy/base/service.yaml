# One stable name in front of pods whose IPs change every time they are
# replaced. Unchanged since Kubernetes Core.
apiVersion: v1
kind: Service
metadata:
  name: timesvc
  labels:
    app: timesvc
spec:
  type: ClusterIP
  selector:
    app: timesvc
  ports:
    - name: http
      port: 80
      targetPort: http
