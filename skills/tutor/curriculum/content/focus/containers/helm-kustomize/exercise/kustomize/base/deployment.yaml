# The Deployment you ended the last lesson with, with two changes:
#
#   * no namespace here — the kustomization sets it, so the same base can be
#     built into two namespaces without editing this file;
#   * configuration arrives through envFrom, so there is exactly one place
#     where the ConfigMap's name appears for Kustomize to rewrite.
#
# Nothing in this file is a TODO. It is the base: the environments differ from
# it, and it does not know they exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timesvc
  labels:
    app: timesvc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: timesvc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: timesvc
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: timesvc
          image: timesvc:1.1.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: timesvc-config
          env:
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
                  divisor: "1"
            - name: GOMEMLIMIT
              value: "110MiB"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
