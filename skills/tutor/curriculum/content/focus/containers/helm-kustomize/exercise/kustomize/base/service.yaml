# Unchanged from the Kubernetes Core lesson, minus the namespace: one stable
# name in front of pods whose IPs change every time they are replaced.
apiVersion: v1
kind: Service
metadata:
  name: timesvc
  labels:
    app: timesvc
spec:
  type: ClusterIP
  selector:
    app: timesvc
  ports:
    - name: http
      port: 80
      targetPort: http
