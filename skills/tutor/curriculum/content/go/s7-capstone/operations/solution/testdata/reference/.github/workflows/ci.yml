name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: formatting
        run: test -z "$(gofmt -l .)"

      - name: test
        run: go test -race ./...

      - name: vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
