name: Engine or skill bug
description: tutor.py or the /tutor skill misbehaves (init, sync, status, verify, grading flow)
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: What you ran
      description: The tutor.py command or the /tutor request, and what state the workspace was in.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste the output. Remove anything personal first.
      render: shell
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: python3 --version
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11 with WSL
  - type: input
    id: version
    attributes:
      label: Curriculum version
      description: The tag you installed, or the commit of your clone (git rev-parse --short HEAD)
