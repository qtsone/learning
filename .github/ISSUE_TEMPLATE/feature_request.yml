name: Lesson, pack, or feature request
description: Propose new curriculum content, a new language track, or an engine feature
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New lesson
        - New focus pack
        - New language track
        - Engine or skill feature
        - Documentation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What it is, and where it slots into the path (which lessons it needs first).
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The gap it fills for a learner, or the problem it solves.
  - type: checkboxes
    id: author
    attributes:
      label: Contribution
      options:
        - label: I am willing to author this (see CONTRIBUTING.md)
