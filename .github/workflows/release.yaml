name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Semantic Release
        uses: qtsone/actions/release@ee194fce6d3fcae000f7076906d50f5126e8e6b5 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ssh-key: ${{ secrets.DEPLOY_KEY }}
