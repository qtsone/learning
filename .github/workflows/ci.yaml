name: CI

on:
  push:
    branches: [main]
  pull_request:
  pull_request_target:
    types: [opened, closed, synchronize]
  issue_comment:
    types: [created]

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.changes.outputs.go }}
      python: ${{ steps.changes.outputs.python }}
      languages: ${{ steps.changes.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: which language tracks changed?
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Unknown base (new branch, force push) means "run everything" rather than guess.
          go=false; python=false
          if git rev-parse -q --verify "$BASE^{commit}" >/dev/null 2>&1; then
            content=skills/tutor/curriculum/content
            for f in $(git diff --name-only "$BASE" HEAD); do
              case "$f" in
                "$content"/go/*|"$content"/focus/*) go=true ;;
                "$content"/python/*|ruff.toml|tools/*) python=true ;;
                "$content"/shared/*|skills/tutor/scripts/*|skills/tutor/curriculum/registry.json|tests/*)
                  go=true; python=true ;;
                .github/workflows/ci.yaml)         go=true; python=true ;;
              esac
            done
          else
            go=true; python=true
          fi
          languages=""
          if [ "$go" = true ]; then languages='"go"'; fi
          if [ "$python" = true ]; then languages="${languages:+$languages,}\"python\""; fi
          {
            echo "go=$go"
            echo "python=$python"
            echo "languages=[$languages]"
          } >> "$GITHUB_OUTPUT"
          echo "since ${BASE:-<unknown base>}: go=$go python=$python, solutions rows: [$languages]"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: python3 skills/tutor/scripts/tutor.py validate --strict
      - run: python3 -m unittest discover -s tests -v
      - name: path hygiene guard
        run: |
          if grep -rnI --exclude-dir=.git --exclude-dir=.ruff_cache --exclude=ci.yaml \
              -e "/Users/" -e "/home/" -e "/private/tmp/" -e "/opt/homebrew/" . \
              | grep -vE "/(Users|home)/ada\b"; then
            echo "machine-specific absolute paths found (use the 'ada' example persona in lessons)"
            exit 1
          fi

  track:
    # Pull requests only: the merged tree was already tested there, so a push to
    # main would only repeat every language's solution suites (~90 for Go). One
    # row per language whose lessons changed, plus every language when the
    # shared lessons, the engine, the registry, its tests or this workflow
    # changed (so a pinned-action bump exercises every row); `solutions` below
    # folds the rows into the ruleset's required check.
    needs: validate
    if: github.event_name == 'pull_request' && needs.validate.outputs.languages != '[]'
    name: solutions (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.validate.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - if: matrix.language == 'python'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - if: matrix.language == 'python'
        run: uv python install 3.14
      - run: python3 skills/tutor/scripts/tutor.py ci --language ${{ matrix.language }}
      - if: matrix.language == 'python'
        name: ruff over the Python content
        run: |
          targets="skills/tutor/scripts tests tools"
          if [ -d skills/tutor/curriculum/content/python ]; then
            targets="$targets skills/tutor/curriculum/content/python"
          fi
          uv tool run ruff@0.16.6 format --check $targets \
            && uv tool run ruff@0.16.6 check $targets

  solutions:
    # The ruleset's required check. Matrix rows report as "solutions (go)" and
    # "solutions (python)", never as "solutions", so this job folds them back
    # into the one name the ruleset knows: green when validate passed and no
    # row failed; rows that never ran count as green, so docs-only changes
    # pass. Skipped via `if` still reports success on pushes to main; a path
    # filter on the trigger would leave it pending and block the merge.
    needs: [validate, track]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "validate: ${{ needs.validate.result }}, rows: ${{ needs.track.result }}"
          test "${{ needs.validate.result }}" = success
          case "${{ needs.track.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac

  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/qtsone/learning/blob/main/.github/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          # bots cannot sign; the steward's own PRs still exercise the flow
          allowlist: renovate[bot],github-actions[bot],dependabot[bot],bot*
