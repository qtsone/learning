name: CI

on:
  push:
    branches: [main]
  pull_request:
  pull_request_target:
    types: [opened, closed, synchronize]
  issue_comment:
    types: [created]

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      curriculum: ${{ steps.changes.outputs.curriculum }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: did the tutor skill change?
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Unknown base (new branch, force push) means "run everything" rather than guess.
          if git rev-parse -q --verify "$BASE^{commit}" >/dev/null 2>&1 \
             && git diff --quiet "$BASE" HEAD -- skills/tutor; then
            echo "curriculum=false" >> "$GITHUB_OUTPUT"
            echo "skills/tutor unchanged since $BASE: skipping the solutions job"
          else
            echo "curriculum=true" >> "$GITHUB_OUTPUT"
            echo "skills/tutor changed since ${BASE:-<unknown base>}: running the solutions job"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: python3 skills/tutor/scripts/tutor.py validate
      - name: path hygiene guard
        run: |
          if grep -rnI --exclude-dir=.git --exclude-dir=.ruff_cache --exclude=ci.yaml \
              -e "/Users/" -e "/home/" . | grep -vE "/(Users|home)/ada\b"; then
            echo "user-specific absolute paths found (use the 'ada' example persona in lessons)"
            exit 1
          fi

  solutions:
    # Skipped via `if` still reports success, so the ruleset's required check
    # passes for docs-only changes; a path filter on the trigger would leave it
    # pending and block the merge.
    needs: validate
    if: needs.validate.outputs.curriculum == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: python3 skills/tutor/scripts/tutor.py ci

  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/qtsone/learning/blob/main/.github/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          # bots cannot sign; the steward's own PRs still exercise the flow
          allowlist: renovate[bot],github-actions[bot],dependabot[bot],bot*
